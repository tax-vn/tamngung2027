<body>
    <div class="container-fluid py-4">
        <h2 class="text-center mb-4 text-primary"><i class="fas fa-building"></i> Danh Sách Công Ty Tạm Ngưng</h2>
        
        <div class="row mb-3">
            <div class="col-md-6 d-flex gap-2 mb-2">
                <button class="btn btn-success" onclick="openModal()"><i class="fas fa-plus"></i> Thêm Mới</button>
                <button class="btn btn-info text-white" onclick="exportData()"><i class="fas fa-download"></i> Backup Data (JSON)</button>
                <label class="btn btn-warning mb-0 text-white">
                    <i class="fas fa-upload"></i> Import Data
                    <input type="file" accept=".json" style="display: none;" onchange="importData(event)">
                </label>
                <button class="btn btn-danger" onclick="clearData()"><i class="fas fa-trash-alt"></i> Xóa Hết (Reset)</button>
            </div>
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm theo MST, Tên Cty, Khách..." onkeyup="renderTable()">
            </div>
        </div>

        <div class="table-container table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle" id="dataTable">
                <thead class="table-dark">
                    <tr>
                        <th>STT</th>
                        <th>ID</th>
                        <th>Box</th>
                        <th>Mã Số Thuế</th>
                        <th>Tên Công Ty</th>
                        <th>Khách</th>
                        <th>SĐT</th>
                        <th>Ngày</th>
                        <th>Phí</th>
                        <th>Ghi Chú</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be loaded here via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form (Add/Edit) -->
    <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Thêm Mới</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="dataForm">
                <input type="hidden" id="editIndex" value="-1">
                <div class="row">
                    <div class="col-md-2 mb-3">
                        <label class="form-label">STT</label>
                        <input type="text" class="form-control" id="stt">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">ID</label>
                        <input type="text" class="form-control" id="id">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Box</label>
                        <input type="text" class="form-control" id="box">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mã Số Thuế <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="mst" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Tên Công Ty <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="ten_cty" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Khách</label>
                        <input type="text" class="form-control" id="khach">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">SĐT</label>
                        <input type="text" class="form-control" id="sdt">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ngày</label>
                        <input type="text" class="form-control" id="ngay" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Phí</label>
                        <input type="text" class="form-control" id="phi">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ghi Chú</label>
                        <input type="text" class="form-control" id="ghichu">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Trạng Thái (Tạm Ngưng)</label>
                    <input type="text" class="form-control" id="trangthai">
                </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            <button type="button" class="btn btn-primary" onclick="saveForm()">Lưu Thông Tin</button>
          </div>
        </div>
      </div>
    </div>

        let appData = [];
        let modalInstance;

        // On Load
        window.onload = function() {
            modalInstance = new bootstrap.Modal(document.getElementById('formModal'));
            loadData();
        };

        // Load data from LocalStorage or default
        function loadData() {
            const storedData = localStorage.getItem('tamngungData');
            if (storedData) {
                appData = JSON.parse(storedData);
            } else {
                appData = [...defaultData];
                saveToLocalStorage();
            }
            renderTable();
        }

        // Save to LocalStorage
        function saveToLocalStorage() {
            localStorage.setItem('tamngungData', JSON.stringify(appData));
        }

        // Render Table
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            appData.forEach((row, index) => {
                // Filter logic
                const searchString = Object.values(row).join(' ').toLowerCase();
                if (searchTerm && !searchString.includes(searchTerm)) {
                    return; // Skip if not matched
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.stt || ''}</td>
                    <td>${row.id || ''}</td>
                    <td>${row.box || ''}</td>
                    <td><strong>${row.mst || ''}</strong></td>
                    <td>${row.ten_cty || ''}</td>
                    <td>${row.khach || ''}</td>
                    <td>${row.sdt || ''}</td>
                    <td>${row.ngay || ''}</td>
                    <td>${row.phi || ''}</td>
                    <td>${row.ghichu || ''}</td>
                    <td><span class="badge bg-warning text-dark">${row.trangthai || ''}</span></td>
                    <td class="action-btns">
                        <button class="btn btn-sm btn-primary" onclick="editData(${index})" title="Sửa"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="deleteData(${index})" title="Xóa"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Open Modal for Add
        function openModal() {
            document.getElementById('dataForm').reset();
            document.getElementById('editIndex').value = -1;
            document.getElementById('modalTitle').innerText = "Thêm Công Ty Mới";
            modalInstance.show();
        }

        // Open Modal for Edit
        function editData(index) {
            const row = appData[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('modalTitle').innerText = "Cập Nhật Thông Tin";
            
            document.getElementById('stt').value = row.stt || '';
            document.getElementById('id').value = row.id || '';
            document.getElementById('box').value = row.box || '';
            document.getElementById('mst').value = row.mst || '';
            document.getElementById('ten_cty').value = row.ten_cty || '';
            document.getElementById('khach').value = row.khach || '';
            document.getElementById('sdt').value = row.sdt || '';
            document.getElementById('ngay').value = row.ngay || '';
            document.getElementById('phi').value = row.phi || '';
            document.getElementById('ghichu').value = row.ghichu || '';
            document.getElementById('trangthai').value = row.trangthai || '';
            
            modalInstance.show();
        }

        // Save Form (Add or Edit)
        function saveForm() {
            const mst = document.getElementById('mst').value.trim();
            const ten_cty = document.getElementById('ten_cty').value.trim();
            
            if(!mst || !ten_cty) {
                alert("Vui lòng nhập Mã Số Thuế và Tên Công Ty!");
                return;
            }

            const newData = {
                stt: document.getElementById('stt').value,
                id: document.getElementById('id').value,
                box: document.getElementById('box').value,
                mst: mst,
                ten_cty: ten_cty,
                khach: document.getElementById('khach').value,
                sdt: document.getElementById('sdt').value,
                ngay: document.getElementById('ngay').value,
                phi: document.getElementById('phi').value,
                ghichu: document.getElementById('ghichu').value,
                trangthai: document.getElementById('trangthai').value
            };

            const editIndex = document.getElementById('editIndex').value;
            
            if (editIndex == -1) {
                // Add new
                appData.push(newData);
            } else {
                // Update
                appData[editIndex] = newData;
            }

            saveToLocalStorage();
            renderTable();
            modalInstance.hide();
        }

        // Delete Data
        function deleteData(index) {
            if (confirm("Bạn có chắc chắn muốn xóa dòng này?")) {
                appData.splice(index, 1);
                saveToLocalStorage();
                renderTable();
            }
        }
        
        // Clear all data
        function clearData() {
            if (confirm("CẢNH BÁO: Xóa toàn bộ dữ liệu đang lưu trên trình duyệt? Hãy đảm bảo bạn đã Backup!")) {
                appData = [];
                saveToLocalStorage();
                renderTable();
            }
        }

        // Export Backup to JSON
        function exportData() {
            const dataStr = JSON.stringify(appData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_tamngung_${new Date().getTime()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Import from JSON
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm("Bạn muốn GHI ĐÈ dữ liệu hiện tại (OK) hay THÊM VÀO (Cancel)?")) {
                            appData = imported;
                        } else {
                            appData = appData.concat(imported);
                        }
                        saveToLocalStorage();
                        renderTable();
                        alert("Import thành công!");
                    } else {
                        alert("File không đúng định dạng mảng JSON!");
                    }
                } catch (error) {
                    alert("Lỗi đọc file JSON: " + error.message);
                }
                // Reset file input
                event.target.value = '';
            };
            reader.readAsText(file);
        }
    </script>
